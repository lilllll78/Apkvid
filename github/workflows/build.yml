name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper le projet
        run: unzip -q FaceCover.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon
        working-directory: FaceCover
      - uses: actions/upload-artifact@v4
        with:
          name: FaceCover-apk
          path: FaceCover/app/build/outputs/apk/debug/app-debug.apk
